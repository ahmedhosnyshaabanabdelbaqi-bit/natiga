# تشغيل محلي كامل — لا يحتاج أي خدمة سحابية مدفوعة.
# البيع والمخازن والحسابات تعمل بالكامل على هذه الحزمة داخل الشبكة الداخلية.

services:
  db:
    image: postgres:16-alpine
    container_name: erp-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-eg_erp}
      POSTGRES_USER: ${DB_USERNAME:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?عرّف DB_PASSWORD في ملف .env}
      # ترتيب عربي صحيح وترميز UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-erp} -d ${DB_DATABASE:-eg_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?شغّل php artisan key:generate ثم ضع القيمة هنا}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: Africa/Cairo
      APP_LOCALE: ar
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-eg_erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      ERP_SYSTEM_NAME: ${ERP_SYSTEM_NAME:-محمد فياض}
      ERP_COMPANY_NAME: ${ERP_COMPANY_NAME:-محمد فياض للتوزيع}
      ERP_BACKUP_KEY: ${ERP_BACKUP_KEY}
    volumes:
      - api-storage:/app/storage
      - ./backups:/app/storage/app/backups
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  # عامل الطوابير: التصدير والرسائل والتكاملات
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-worker
    depends_on:
      api:
        condition: service_started
    command: php artisan queue:work --tries=3 --backoff=10 --timeout=300 --sleep=3
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-eg_erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      ERP_BACKUP_KEY: ${ERP_BACKUP_KEY}
    volumes:
      - api-storage:/app/storage
      - ./backups:/app/storage/app/backups
    restart: unless-stopped

  # المهام المجدولة: النسخ الاحتياطية وتنظيف الحجوزات ومؤشرات الاستثناءات
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-scheduler
    depends_on:
      api:
        condition: service_started
    command: php artisan schedule:work
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-eg_erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD}
      ERP_BACKUP_KEY: ${ERP_BACKUP_KEY}
    volumes:
      - api-storage:/app/storage
      - ./backups:/app/storage/app/backups
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000/api/v1}
    container_name: erp-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db-data:
  api-storage:
