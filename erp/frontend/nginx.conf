server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # الـ API يُمرَّر إلى حاوية Laravel على نفس النطاق، فلا توجد مشكلة CORS
    # ولا حاجة لمعرفة عنوان الخادم وقت البناء.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 32m;
    }

    location = /up {
        proxy_pass http://api:8000/up;
        proxy_set_header Host $host;
    }

    # توجيه مسارات التطبيق أحادي الصفحة
    location / {
        try_files $uri $uri/ /index.html;
    }

    # الخطوط والأصول الثابتة
    location ~* \.(woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # رؤوس أمان أساسية
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
