# ---------------------------------------------------------------------------
# محمد فياض — نظام إدارة التوزيع
# إعداد Nginx للتثبيت المباشر على الخادم (بدون Docker).
#
# انسخ هذا الملف إلى:
#   /etc/nginx/sites-available/mohamed-fayad-erp.conf
# ثم:
#   ln -s /etc/nginx/sites-available/mohamed-fayad-erp.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# غيّر القيمتين التاليتين حسب خادمك:
#   server_name      : اسم النطاق أو عنوان IP للخادم
#   /opt/mohamed-fayad-erp : مسار تثبيت النظام
#   php8.4-fpm.sock  : نسخة PHP-FPM المثبتة لديك
# ---------------------------------------------------------------------------

server {
    listen 80;
    # فعّل السطر التالي إن كان خادمك يدعم IPv6
    # listen [::]:80;
    server_name _;            # ← ضع نطاقك هنا، مثل erp.example.com

    charset utf-8;
    client_max_body_size 32m;

    # الواجهة (ملفات البناء الجاهزة)
    root /opt/mohamed-fayad-erp/frontend/dist;
    index index.html;

    access_log /var/log/nginx/erp-access.log;
    error_log  /var/log/nginx/erp-error.log;

    # ------------------------------------------------------------------
    # الـ API: يُخدَم من Laravel مباشرة على نفس النطاق، فلا توجد مشكلة CORS
    # ------------------------------------------------------------------
    location ^~ /api/ {
        root /opt/mohamed-fayad-erp/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # فحص صحة الخادم
    location = /up {
        root /opt/mohamed-fayad-erp/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        # لا يُستدعى إلا عبر التوجيه الداخلي من الكتل أعلاه
        internal;
        root /opt/mohamed-fayad-erp/backend/public;

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # ------------------------------------------------------------------
    # الواجهة أحادية الصفحة: أي مسار غير موجود يعود إلى index.html
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # الأصول الثابتة والخطوط العربية
    location ~* \.(woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # منع الوصول للملفات الحساسة
    location ~ /\.(?!well-known) { deny all; }

    # رؤوس أمان أساسية
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
# بعد تشغيل النظام على HTTP وتجربته، فعّل HTTPS بأمر واحد:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d erp.example.com
# سيتولّى certbot تعديل هذا الملف وإضافة كتلة 443 والتجديد التلقائي.
# ---------------------------------------------------------------------------
