# EV Car News — Android test build.
# Builds an installable APK on GitHub's runners (they ship the Android SDK,
# which the development container cannot download) and publishes it as a
# GitHub pre-release so it can be downloaded straight to a phone.
#
# The APK is signed with the runner's DEBUG key unless release signing is
# configured (android/key.properties), so it is for testing only: uninstall
# the previous test build before installing a new one.
#
# API base URL: set the repository variable EVCAR_API_BASE_URL
# (Settings → Secrets and variables → Actions → Variables), e.g.
# https://api.evcar.news/api/v1. Without a reachable backend the app shows
# its offline / "cannot connect" states.
name: evcar-android

on:
  push:
    branches: ['claude/**', main]
    paths: ['evcar-news/mobile/**', '.github/workflows/evcar-android.yml']
  workflow_dispatch:

concurrency:
  group: evcar-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: evcar-news/mobile
    env:
      API_BASE_URL: ${{ vars.EVCAR_API_BASE_URL || 'https://api.evcar.news/api/v1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart run tool/merge_arb.dart
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - name: Build APK (split per ABI + universal)
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="$API_BASE_URL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/evcar-news-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/evcar-news-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/evcar-news-arm32.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: evcar-news-apk-${{ github.run_number }}
          path: evcar-news/mobile/dist/
          retention-days: 30
      - name: Publish test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-test-${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          NOTES=$(printf '%s\n' \
            "نسخة تجريبية للاختبار فقط (Test build) — commit ${SHORT_SHA} على الفرع ${GITHUB_REF_NAME}." \
            "" \
            "- evcar-news-arm64.apk: لمعظم الهواتف الحديثة" \
            "- evcar-news-universal.apk: يعمل على كل الأجهزة (حجم أكبر)" \
            "" \
            "موقّعة بمفتاح debug: احذف النسخة السابقة قبل تثبيت الجديدة." \
            "API: ${API_BASE_URL}")
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "EV Car News — Android test build #${{ github.run_number }}" \
            --notes "$NOTES"
