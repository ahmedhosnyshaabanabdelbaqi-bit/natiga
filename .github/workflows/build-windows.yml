name: Build Windows installer

on:
  push:
    branches: [main, "claude/**"]
    paths: ["qasr-almaadi/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: qasr-almaadi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qasr-almaadi/package-lock.json
      - run: npm ci
      - name: Typecheck and server/desktop smoke test
        run: |
          npx tsc --noEmit
          npm run build
          npm run test:desktop
      - name: Build installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: QasrAlMaadi-Windows-Installer
          path: qasr-almaadi/release/QasrAlMaadi-Setup-*.exe
          if-no-files-found: error
      - name: Attach installer to the GitHub release
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" release/QasrAlMaadi-Setup-*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
