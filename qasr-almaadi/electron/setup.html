<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:; font-src file:">
<title>الإعداد الأول</title>
<style>
  @font-face { font-family:"Cairo"; src:url("../node_modules/@fontsource-variable/cairo/files/cairo-arabic-wght-normal.woff2") format("woff2"); font-weight:200 1000; unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF; }
  @font-face { font-family:"Cairo"; src:url("../node_modules/@fontsource-variable/cairo/files/cairo-latin-wght-normal.woff2") format("woff2"); font-weight:200 1000; unicode-range:U+0000-00FF,U+2000-206F; }
  :root { --bg:#f2f5f8; --surface:#fff; --text:#203c4a; --muted:#5c7280; --line:#dfe8ec; --teal:#087f80; --teal-dark:#066a6b; --teal-soft:#e6f3f3; --bad:#b42318; }
  * { box-sizing:border-box; font-family:"Cairo","Segoe UI",Tahoma,sans-serif; }
  body { margin:0; background:var(--bg); color:var(--text); padding:22px 26px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  header img { width:58px; height:58px; border-radius:12px; background:#fff; border:1px solid var(--line); padding:4px; }
  h1 { font-size:21px; margin:0; }
  p.sub { color:var(--muted); margin:2px 0 0; font-size:13.5px; }
  form { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:11px; box-shadow:0 4px 18px rgba(32,60,74,.06); }
  label { display:grid; gap:5px; font-size:14px; font-weight:600; }
  small { color:var(--muted); font-weight:400; font-size:12.5px; }
  input { background:#fff; border:1px solid #c9d7dd; border-radius:9px; padding:10px 12px; color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }
  button { background:var(--teal); color:#fff; border:0; border-radius:10px; padding:12px; font-size:16px; font-weight:700; cursor:pointer; margin-top:2px; }
  button:hover { background:var(--teal-dark); }
  button:disabled { opacity:.6; cursor:wait; }
  #err { color:var(--bad); min-height:20px; font-size:14px; font-weight:600; }
  .warn { background:#fff7e6; border:1px solid #f1d38a; color:#7a4f00; border-radius:9px; padding:9px 11px; font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <img src="../public/hospital-logo.png" alt="">
  <div><h1>مرحبًا بك في نظام مستشفى قصر المعادي</h1>
  <p class="sub">إعداد لمرة واحدة قبل أول تشغيل. تُحفظ كل البيانات على هذا الجهاز فقط.</p></div>
</header>
<form id="f">
  <label>اسم المستشفى<input name="hospitalName" required maxlength="160" value="مستشفى قصر المعادي"></label>
  <label>اسم مستخدم المدير<input name="username" required value="admin" dir="ltr" autocomplete="off"><small>حروف إنجليزية وأرقام (٣ أحرف على الأقل)</small></label>
  <label>كلمة مرور المدير<input name="password" type="password" required minlength="16" dir="ltr" autocomplete="new-password"><small>١٦ حرفًا على الأقل</small></label>
  <label>تأكيد كلمة المرور<input name="confirm" type="password" required dir="ltr" autocomplete="new-password"></label>
  <label>كلمة سر النسخ الاحتياطي المشفّر<input name="backupPassphrase" type="password" required minlength="16" dir="ltr" autocomplete="new-password"><small>١٦ حرفًا على الأقل، وتختلف عن كلمة مرور المدير</small></label>
  <div class="warn">اكتب كلمة سر النسخ الاحتياطي واحفظها في مكان آمن خارج هذا الجهاز. لا يمكن استرجاع أي نسخة احتياطية بدونها.</div>
  <div id="err" role="alert"></div>
  <button id="go" type="submit">إنشاء النظام وبدء التشغيل</button>
</form>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = ""; go.disabled = true;
    const r = await window.setupApi.submit(Object.fromEntries(new FormData(f)));
    if (!r.ok) { err.textContent = r.error; go.disabled = false; }
  });
</script>
</body>
</html>
