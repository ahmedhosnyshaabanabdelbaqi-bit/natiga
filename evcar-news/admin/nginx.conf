# Rendered by the nginx image's envsubst templating (API_UPSTREAM).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # Same-origin API keeps the httpOnly refresh cookie first-party.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API trusts exactly one proxy hop (TRUST_PROXY=1 or this host's
    # address): overwrite instead of appending so a client cannot inject
    # fake addresses in front of its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 50m;
  }

  # Hashed build assets: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /vendor/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback; never cache index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
