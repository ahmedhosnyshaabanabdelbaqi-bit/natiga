# EV Car News deploy kit — mounted into the admin container's /etc/nginx/conf.d
# (included inside `http {}` of the image's nginx.conf) by docker-compose.prod.yml.
#
# The admin pages /setup-password?token=… (owner setup, valid 24 h) and
# /reset-password?token=… carry one-time tokens in the query string; nginx's
# default access log would keep them (docker logs, `sudo evcar logs admin`).
# This static-file container keeps no access log at all ("off" at the http
# level disables every access_log of that level and of all servers below it).
# Errors are still logged. Requests are logged by the API (tokens masked).
access_log off;
