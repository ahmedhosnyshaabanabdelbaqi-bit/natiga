# =============================================================================
# EV Car News — production stack for ONE Ubuntu VPS.
#
# Do not run this file by hand: use deploy/evcar.sh (installed as `evcar`),
# which passes the right --env-file, the proxy-mode override
# (compose.caddy.yml or compose.host-proxy.yml), the profiles and the
# rendered backend environment file:
#
#   sudo evcar up | status | logs | update | backup | restore ...
#
# Layout
#   postgres  PostGIS 16, data volume, only on the internal `data` network
#   redis     password + AOF, only on the internal `data` network
#   api       NestJS API (runs migrations + reference seed on start)
#   worker    same image, BullMQ workers + schedulers (profile "worker")
#   admin     admin panel (static SPA in nginx, profile "admin")
#   mailpit   local e-mail OUTBOX used only while no SMTP server is configured
#             (profile "mail-outbox"; nothing is delivered to real inboxes)
#   caddy     TLS reverse proxy — compose.caddy.yml (ports 80/443)
#
# Nothing in this file publishes a port on a public interface. PostgreSQL and
# Redis are never published. Media files live in the `storage` volume
# (STORAGE_DRIVER=local); S3-compatible storage is an option (docs/DEPLOYMENT.md).
#
# api, worker, admin (and caddy) run with a read-only root filesystem: code
# execution inside them cannot rewrite the application (the storage volume and
# a small /tmp stay writable). EVCAR_READ_ONLY_ROOT=false in .env.production
# switches this off (escape hatch; then run `sudo evcar up`).
# =============================================================================
name: evcar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Environment shared by the API and the worker. Values that depend on the
# container layout are fixed here and win over the rendered env file
# (EVCAR_BACKEND_ENV_FILE, generated by evcar.sh from .env.production and
# filtered to the variables documented in /.env.example).
x-backend-env: &backend-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  LOG_PRETTY: "false"
  DATABASE_URL: postgresql://${APP_DB_USER:-evcar_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set - run evcar through deploy/evcar.sh}@postgres:5432/${POSTGRES_DB:-evcar}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set}@redis:6379/0
  STORAGE_LOCAL_ROOT: /app/storage
  RATE_LIMIT_STORAGE: redis
  AUTH_COOKIE_SECURE: "true"
  # Prisma's update check would try to write a cache under $HOME (read-only root).
  CHECKPOINT_DISABLE: "1"

services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:-evcar}
      # Used by postgres/initdb/10-evcar-init.sh (first start) and by
      # `evcar up` (idempotent role/extension bootstrap).
      APP_DB_USER: ${APP_DB_USER:-evcar_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-2000}
      - -c
      - log_lock_waits=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Replaces the image's init scripts: only the extensions the app needs
      # + an unprivileged owner role for the application.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-1G}
          pids: 512
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.11-alpine}
    # BullMQ requires maxmemory-policy noeviction (jobs must never be evicted).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-384M}
          pids: 256
    logging: *logging

  api:
    build:
      context: ../backend
    # "localhost/..." can never be pulled from a public registry by mistake.
    image: localhost/evcar-backend:${EVCAR_RELEASE:-local}
    init: true
    env_file:
      - ${EVCAR_BACKEND_ENV_FILE:?EVCAR_BACKEND_ENV_FILE is not set - use deploy/evcar.sh}
    environment:
      <<: *backend-env
      # Exactly one proxy hop (Caddy, or the host nginx/apache) in front of the API.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RUN_MIGRATIONS: "true"
      RUN_REFERENCE_SEED: "true"
      # false when the separate worker runs (EVCAR_WORKER_MODE=separate).
      JOBS_ENABLED: ${EVCAR_API_JOBS_ENABLED:-true}
      NODE_OPTIONS: --max-old-space-size=${API_NODE_MAX_OLD_SPACE_MB:-512}
    volumes:
      - storage:/app/storage
    read_only: ${EVCAR_READ_ONLY_ROOT:-true}
    tmpfs:
      # RAM-backed and counted in the memory limit; sharp/libvips temp files.
      - /tmp:size=${API_TMP_SIZE:-256m},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start applies all migrations + the reference seed.
      start_period: 180s
    networks: [data, edge]
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-768M}
          pids: 512
    logging: *logging

  worker:
    image: localhost/evcar-backend:${EVCAR_RELEASE:-local}
    pull_policy: never
    profiles: [worker]
    init: true
    env_file:
      - ${EVCAR_BACKEND_ENV_FILE:?EVCAR_BACKEND_ENV_FILE is not set - use deploy/evcar.sh}
    environment:
      <<: *backend-env
      TRUST_PROXY: "false"
      RUN_MIGRATIONS: "false"
      RUN_REFERENCE_SEED: "false"
      JOBS_ENABLED: "true"
      # Image processing (sharp/libvips) happens outside the V8 heap; the
      # container limit below is what bounds it.
      NODE_OPTIONS: --max-old-space-size=${WORKER_NODE_MAX_OLD_SPACE_MB:-512}
    volumes:
      - storage:/app/storage
    read_only: ${EVCAR_READ_ONLY_ROOT:-true}
    tmpfs:
      - /tmp:size=${WORKER_TMP_SIZE:-512m},mode=1777
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    # `edge` gives the worker outbound internet access (RSS, Open Charge Map...).
    # Its HTTP port is never published or proxied.
    networks: [data, edge]
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-1G}
          pids: 512
    logging: *logging

  admin:
    build:
      context: ../admin
    image: localhost/evcar-admin:${EVCAR_RELEASE:-local}
    profiles: [admin]
    environment:
      # The admin's own /api proxy is not used in production (Caddy or the host
      # proxy routes <admin-domain>/api/* straight to the API), but nginx needs
      # a resolvable upstream to start.
      API_UPSTREAM: http://api:3000
    volumes:
      # No access log in this container: /setup-password?token=… and
      # /reset-password?token=… carry one-time tokens in the query string.
      - ./admin/00-evcar-no-access-log.conf:/etc/nginx/conf.d/00-evcar-no-access-log.conf:ro
    # nginx:alpine: the entrypoint renders the template into conf.d, the master
    # (root) writes its pid and creates the temp dirs, then drops to `nginx`.
    read_only: ${EVCAR_READ_ONLY_ROOT:-true}
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [edge]
    restart: unless-stopped
    cap_drop: [ALL]
    # CHOWN: temp dirs handed to the worker user; SETUID/SETGID: workers drop to `nginx`.
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${ADMIN_MEM_LIMIT:-96M}
          pids: 128
    logging: *logging

  mailpit:
    # Local outbox ONLY (profile "mail-outbox", enabled while SMTP_HOST=mailpit):
    # the backend refuses MAIL_DRIVER=console in production, so until real SMTP
    # is configured e-mails are captured here and NOT delivered. They include
    # password-reset links, so the UI and API require a password (user
    # "evcar", MAILPIT_UI_PASSWORD, generated by evcar.sh; /readyz stays open for
    # the image healthcheck). UI on 127.0.0.1 only:
    # ssh -L 8025:127.0.0.1:8025 root@<server> → http://localhost:8025 (sudo evcar mail-outbox)
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.2}
    profiles: [mail-outbox]
    environment:
      MP_MAX_MESSAGES: "2000"
      MP_UI_AUTH: evcar:${MAILPIT_UI_PASSWORD:-}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    # Only `edge` (the API/worker reach its SMTP port there): no route to
    # PostgreSQL or Redis.
    networks: [edge]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128
    logging: *logging

networks:
  # No route to the internet and not reachable from the proxy: database + Redis.
  data:
    internal: true
  # Proxy ↔ API/admin, and outbound internet for the API/worker.
  edge: {}

volumes:
  postgres-data:
  redis-data:
  storage:
