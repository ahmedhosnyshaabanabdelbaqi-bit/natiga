# EV Car News — "nginx" / "apache" / "external" proxy modes: ports 80/443 already
# belong to a web server on this host (e.g. the one serving evcar.news).
# The API and the admin panel are published on 127.0.0.1 ONLY; the host web
# server proxies https://API_DOMAIN (and https://ADMIN_DOMAIN) to them.
# See `sudo evcar proxy-config` for the generated vhost and docs/DEPLOYMENT.md.
# Used together with docker-compose.prod.yml by deploy/evcar.sh.
services:
  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"

  admin:
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8081}:8080"
