<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    EV Car News — WEB DESIGN PREVIEW ONLY.
    Production targets are Android and iOS (docs/decisions/prep-mobile.md).
    This build exists so designers/reviewers can look at screens in a
    browser; plugins without web support (SQLite cache, local notifications,
    the 360° WebView, sensors) fall back to in-memory or "not supported"
    states. It is not a public website and must not be indexed.

    <base href> is replaced by `flutter build web --base-href`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EV Car News — design preview of the mobile app (not a public website).">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A5CFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EV Car News">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EV Car News — preview</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F7FC; }
    @media (prefers-color-scheme: dark) { html, body { background: #0A1020; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
