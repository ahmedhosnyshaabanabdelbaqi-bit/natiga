<!DOCTYPE html>
<!--
  EV Car News — isolated 360° interior viewer (SKELETON, to be completed by the
  tours feature; see mobile/README.md → "360° viewer").

  Loaded by the Flutter app from the bundled asset (webview_flutter
  loadFlutterAsset). Security model (ARCHITECTURE §6, REQUIREMENTS §19):
   * no remote scripts: Pannellum is vendored in ./pannellum (MIT, v2.5.7);
   * the CSP below is the baseline; on "init" viewer.js adds a second, stricter
     CSP meta that limits images/XHR to the configured media origin (multiple
     policies are enforced together, so this can only tighten);
   * the app's NavigationDelegate blocks every navigation except this file;
   * messages in both directions follow the schema in viewer.js and are
     validated; hotspot text is rendered with textContent only.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; connect-src https:; media-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; child-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EV Car News 360°</title>
  <link rel="stylesheet" href="pannellum/pannellum.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="panorama" role="application" aria-label="360°"></div>
  <div id="status" role="status" aria-live="polite" hidden></div>
  <script src="pannellum/pannellum.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
