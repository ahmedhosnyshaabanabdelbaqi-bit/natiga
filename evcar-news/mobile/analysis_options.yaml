# Static analysis for the EV Car News app. `flutter analyze` must report
# "No issues found!" (ARCHITECTURE §6).
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - directives_ordering
    - cancel_subscriptions
    - close_sinks
    - avoid_void_async
    - prefer_final_in_for_each
    - use_colored_box
    - use_decorated_box
