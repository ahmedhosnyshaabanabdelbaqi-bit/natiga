# EV Car News — local full stack.
#   docker compose up -d --build
# API:      http://localhost:3000/api/v1   (OpenAPI UI: http://localhost:3000/api/docs)
# Admin:    http://localhost:5173
# Mailpit:  http://localhost:8025 (all e-mails sent by the backend)
# MinIO:    http://localhost:9001 (console)
# Credentials below are LOCAL DEVELOPMENT defaults only — override them via a
# root .env file (see .env.example) and never use them in production.
name: evcar-news

x-dev-credentials: &dev-db
  POSTGRES_USER: ${POSTGRES_USER:-evcar}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evcar_dev_pw}
  POSTGRES_DB: ${POSTGRES_DB:-evcar_dev}

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment: *dev-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # MinIO no longer publishes images on Docker Hub; pin a tag you have verified.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-evcar_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-evcar_minio_dev_pw}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    # Creates the media bucket; only the public/ prefix is anonymously readable.
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-evcar_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-evcar_minio_dev_pw}
      S3_BUCKET: ${S3_BUCKET:-evcar-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        i=0
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          i=$$((i+1)); [ "$$i" -gt 60 ] && echo "minio not reachable" && exit 1; sleep 1
        done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set download "local/$${S3_BUCKET}/public"
        echo "bucket $${S3_BUCKET} ready"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    init: true
    # Every variable of the root .env (see .env.example: integrations such as
    # FCM_*, APNS_*, ASSISTANT_*, GEOCODING_*, SMTP_USER/SMTP_PASSWORD,
    # RATE_LIMIT_*, JWT_*_TTL…) reaches the backend. The `environment` block
    # below wins for container-specific values (hosts, drivers, ports).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      # The admin's Vite proxy (and nginx in production) forwards the client
      # IP in X-Forwarded-For; without trusting it, every admin user would
      # share the proxy's IP for rate limits and login lockouts. Here the
      # proxies live on the private compose network. In production set it to
      # the exact proxy address(es) or hop count and do NOT publish the API
      # port directly (a client could then spoof X-Forwarded-For).
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      RUN_MIGRATIONS: "true"
      RUN_REFERENCE_SEED: "true"
      PORT: "3000"
      LOG_PRETTY: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3000}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:5173}
      SHARE_BASE_URL: ${SHARE_BASE_URL:-https://evcar.news}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-evcar}:${POSTGRES_PASSWORD:-evcar_dev_pw}@postgres:5432/${POSTGRES_DB:-evcar_dev}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-evcar-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-evcar_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-evcar_minio_dev_pw}
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/evcar-media}
      MAIL_DRIVER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: ${MAIL_FROM:-EV Car News <no-reply@evcar.news>}
      OCM_API_KEY: ${OCM_API_KEY:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-none}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      APPLE_OAUTH_CLIENT_IDS: ${APPLE_OAUTH_CLIENT_IDS:-}
      JOBS_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend-storage:/app/storage
    restart: unless-stopped

  admin:
    # Vite dev server of the admin panel. It proxies /api to the backend
    # service (admin/vite.config.ts reads EVCAR_API_PROXY_TARGET), so the
    # refresh cookie stays first-party. Production image: admin/Dockerfile
    # (nginx, API_UPSTREAM).
    image: node:22.23.3-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      EVCAR_API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./admin:/app
      - admin-node-modules:/app/node_modules
    ports:
      - "${ADMIN_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-storage:
  admin-node-modules:
